<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZioShu website</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Verdana, sans-serif;
        color: #efeff1;
        background-color: #0e0e10;
      }

      .header {
        position: relative;
        background-color: #18181b;
        padding: 5px;
        text-align: center;
      }

      .header h1 {
        margin: 8px 0;
        font-size: 1.5em;
      }

      .topnav {
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
      }

      .topnav a {
        color: #efeff1;
        margin-left: 15px;
        text-decoration: none;
      }

      .topnav a:hover {
        color: #bf94ff;
      }

      .content {
        display: flex;
        gap: 7px;
        margin-top: 7px;
      }

      .main {
        flex: 4;
        background-color: #18181b;
        padding: 0 20px;
      }

      .right {
        flex: 1;
        background-color: #26262c;
        padding: 15px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      iframe {
        display: block;
        margin: 0 auto;
        width: 100%;
        aspect-ratio: 16 / 9;
        height: auto;
      }
      .right img {
        width: 100%;
        border-radius: 8px;
      }

      .footer {
        background-color: #18181b;
        text-align: center;
        padding: 10px;
        margin-top: 7px;
      }

      @media only screen and (max-width: 800px) {
        .content {
          flex-direction: column;
        }

        .topnav {
          position: static;
          transform: none;
          padding-bottom: 8px;
        }

        .topnav a {
          margin: 0 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>首頁</h1>
      <div class="topnav">
        <a href="index.html">首頁</a>
        <a href="chart.html">圖表 </a>
        <a href="link.html">其餘同學連結</a>
      </div>
    </div>

    <div class="content">
      <div class="main">
        <div>
          <img src="1474753349214801972.webp" /><img
            src="1474753349214801972.webp"
          /><img src="1474753349214801972.webp" />
        </div>
        <p>
          <iframe
            src="https://www.youtube.com/embed/Tl-b5nQ34fU"
            title="【世誠】逼寶主子的驕傲時刻！"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </p>
      </div>

      <div class="right">
        <img src="003267ffc293cedc1aea4dedc925367f.jpg" />
      </div>
    </div>

    <div class="footer">© copyright 41543133 許秉焱</div>
  </body>
</html>
